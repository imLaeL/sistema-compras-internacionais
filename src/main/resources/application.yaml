spring:
  application:
    name: compras-internacionais
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/compras-internacionais-db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
  cloud:
    openfeign:
      client:
        config:
          awesomeApiClient:
            connect-timeout: 3000
            read-timeout: 5000
integrations:
  awesomeapi:
    url: https://economia.awesomeapi.com.br
